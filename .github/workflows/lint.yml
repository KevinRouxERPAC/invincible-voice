name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-backend:
    name: Lint & Test Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Run pre-commit
        run: uvx pre-commit run --all-files

      - name: Run Pytest
        working-directory: services/backend
        run: |
          uv sync --group dev
          uv run pytest

  lint-frontend:
    name: Lint & Test Frontend (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: services/frontend
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: services/frontend
        run: pnpm lint

      - name: Run Jest tests
        working-directory: services/frontend
        run: pnpm test

      - name: Build frontend
        working-directory: services/frontend
        run: pnpm build

  build-docker-images:
    name: Build docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend (Cloud Run target)
        run: docker build --target cloudrun -t invincible-voice-backend:latest services/backend

      - name: Build frontend (production image)
        run: docker build -t invincible-voice-frontend:latest services/frontend
